name: Generate snake animation

on:
  schedule:
    - cron: "0 0 * * *"   # una vez al día
  workflow_dispatch:       # y cuando lo lances a mano
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#b8862f&color_dots=#e6ebf2,#b9cbe6,#7d9fd0,#3f6db0,#132c55
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#e8c37a&color_dots=#13233f,#1f4f99,#2a6bc4,#6f9ad8,#dbe4f0

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
