<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#151a3d"/>
      <stop offset="1" stop-color="#2a1660"/>
    </linearGradient>

    <linearGradient id="txt" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#a371f7"/>
      <stop offset="0.33" stop-color="#58a6ff"/>
      <stop offset="0.66" stop-color="#f778ba"/>
      <stop offset="1" stop-color="#a371f7"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1200 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a371f7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a371f7"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>

    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>

    <clipPath id="card"><rect width="1200" height="340" rx="22"/></clipPath>

    <style>
      .name { font: 800 76px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: -1px; }
      .sub  { font: 500 22px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 4px; fill: #c9d1d9; }
      .in1  { animation: rise 1.2s cubic-bezier(.2,.8,.2,1) both; }
      .in2  { animation: rise 1.2s cubic-bezier(.2,.8,.2,1) .6s both; }
      .draw { stroke-dasharray: 520; stroke-dashoffset: 520; animation: draw 1.4s ease-out 1s forwards; }
      .tw   { animation: tw 3s ease-in-out infinite; }
      @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes tw   { 0%,100% { opacity: .15; } 50% { opacity: .9; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>

    <!-- orbes de luz que se mueven -->
    <circle r="150" fill="#6e40c9" opacity="0.55" filter="url(#blur)">
      <animate attributeName="cx" values="180;320;180" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="80;220;80" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle r="130" fill="#1f6feb" opacity="0.45" filter="url(#blur)">
      <animate attributeName="cx" values="1020;860;1020" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="260;110;260" dur="15s" repeatCount="indefinite"/>
    </circle>
    <circle r="90" fill="#f778ba" opacity="0.25" filter="url(#blur)">
      <animate attributeName="cx" values="640;720;560;640" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="300;260;300" dur="9s" repeatCount="indefinite"/>
    </circle>

    <!-- estrellas -->
    <g fill="#ffffff">
      <circle class="tw" cx="90"   cy="60"  r="1.6" style="animation-delay:0s"/>
      <circle class="tw" cx="260"  cy="290" r="1.2" style="animation-delay:.8s"/>
      <circle class="tw" cx="420"  cy="40"  r="1.4" style="animation-delay:1.6s"/>
      <circle class="tw" cx="780"  cy="50"  r="1.2" style="animation-delay:.4s"/>
      <circle class="tw" cx="940"  cy="300" r="1.6" style="animation-delay:2.2s"/>
      <circle class="tw" cx="1120" cy="70"  r="1.3" style="animation-delay:1.2s"/>
      <circle class="tw" cx="1060" cy="190" r="1"   style="animation-delay:2.6s"/>
      <circle class="tw" cx="150"  cy="200" r="1"   style="animation-delay:1.9s"/>
    </g>

    <!-- nombre -->
    <g class="in1">
      <text class="name" x="600" y="165" text-anchor="middle" fill="url(#txt)" filter="url(#glow)">Darío Morales Riega</text>
    </g>

    <!-- línea -->
    <path class="draw" d="M340 200 H860" stroke="url(#line)" stroke-width="2" fill="none"/>

    <!-- subtítulo -->
    <g class="in2">
      <text class="sub" x="600" y="245" text-anchor="middle">SOFTWARE ENGINEERING STUDENT · UNIVERSITY OF OVIEDO</text>
    </g>

    <rect width="1198" height="338" x="1" y="1" rx="21" fill="none" stroke="#a371f7" stroke-opacity="0.25"/>
  </g>
</svg>
